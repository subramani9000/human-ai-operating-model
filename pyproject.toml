[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hao"
version = "0.4.0"
description = "Human+AI operating model: a simulated FDE engagement for an enterprise service desk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "subramani9000" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "faker>=24.0",
  "typer>=0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "anthropic>=0.40", "hypothesis>=6.100"]

[project.scripts]
hao = "hao.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option defaults are the idiomatic CLI pattern
