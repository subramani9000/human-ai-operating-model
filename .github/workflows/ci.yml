name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Validate operating-model policy
        run: hao policy validate
      - name: Generate synthetic dataset (deterministic)
        run: hao generate --n 5000 --seed 42 --sample 200
      - name: Tests
        run: pytest -q
      - name: Eval gate — fail if redaction, classification or simulated over-autonomy got worse
        run: hao eval gate
      - name: Redaction recall gate (exits non-zero if any known PII leaks)
        run: hao eval redaction --no-write --min-recall 0.99 > /dev/null
      - name: Short end-to-end pilot simulation (smoke test of the whole learning loop)
        run: hao pilot simulate --days 6 --per-day 60 --out /tmp/pilot-readout.md && head -20 /tmp/pilot-readout.md
