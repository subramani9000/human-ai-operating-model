name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Validate operating-model policy
        run: hao policy validate
      - name: Generate synthetic dataset (deterministic)
        run: hao generate --n 5000 --seed 42 --sample 200
      - name: Tests
        run: pytest -q
      - name: Eval — redaction (fails the build if PII leaks; see tests/test_redaction.py)
        run: hao eval redaction --no-write
      - name: Eval — keyword baseline on both golden sets
        run: |
          hao eval classify --classifier keyword --golden golden_v1 --no-write | head -20
          hao eval classify --classifier keyword --golden hard_v1 --no-write | head -20
      - name: Policy simulation — what would a promotion do?
        run: hao policy simulate --golden golden_v1 --promote password_reset=A3 --no-write | head -12
      - name: Short end-to-end pilot simulation (smoke test of the whole learning loop)
        run: hao pilot simulate --days 6 --per-day 60 --out /tmp/pilot-readout.md && head -20 /tmp/pilot-readout.md
