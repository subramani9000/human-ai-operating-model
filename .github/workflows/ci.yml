name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Validate operating-model policy
        run: hao policy validate
      - name: Generate synthetic dataset (deterministic)
        run: hao generate --n 5000 --seed 42 --sample 200
      - name: Tests
        run: pytest -q
