services:
  postgres:
    image: pgvector/pgvector:pg16   # pgvector is used for knowledge search from Phase 2
    environment:
      POSTGRES_USER: hao
      POSTGRES_PASSWORD: hao
      POSTGRES_DB: hao
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hao"]
      interval: 5s
      retries: 10

  mock-ticketing:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://hao:hao@postgres:5432/hao
      MOCK_API_KEY: ${MOCK_API_KEY:-kaveri-dev-key}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-kaveri-webhook-secret}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.0}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
      MOCK_WEBHOOK_DUPLICATE_RATE: ${MOCK_WEBHOOK_DUPLICATE_RATE:-0.0}
    ports: ["8001:8001"]
    depends_on:
      postgres:
        condition: service_healthy

  platform:
    build: .
    command: ["hao", "platform", "serve", "--port", "8002", "--classifier", "${HAO_CLASSIFIER:-keyword}"]
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://hao:hao@postgres:5432/hao
      TICKETING_BASE_URL: http://mock-ticketing:8001
      PLATFORM_PUBLIC_URL: http://platform:8002
      MOCK_API_KEY: ${MOCK_API_KEY:-kaveri-dev-key}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-kaveri-webhook-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_EMAIL_HEADER: ${AUTH_EMAIL_HEADER:-X-Forwarded-Email}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
    ports: ["8002:8002"]   # dev only: remove when the sso profile is in front
    depends_on:
      postgres:
        condition: service_healthy
      mock-ticketing:
        condition: service_started

  # SSO for the review console and dashboard (ADR 0011). Enable with:  docker compose --profile sso up
  # Needs an OIDC client registered in Kaveri's IdP; set the three OAUTH2_PROXY_* values below.
  # Run the platform with AUTH_MODE=proxy and AUTH_EMAIL_HEADER=X-Forwarded-Email (set by --pass-user-headers).
  # Make the proxy the only way in: don't publish the platform's port 8002, or have the proxy inject
  # X-Proxy-Secret (oauth2-proxy alpha config: injectRequestHeaders) and set AUTH_PROXY_SECRET to match.
  sso-proxy:
    profiles: ["sso"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    command:
      - --http-address=0.0.0.0:4180
      - --upstream=http://platform:8002
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER_URL:-https://login.kaveri.example}
      - --email-domain=kaveri.example
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --skip-auth-route=^/(health|webhooks/ticketing|metrics/prometheus)$
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
    ports: ["4180:4180"]
    depends_on: [platform]

volumes:
  pgdata:
